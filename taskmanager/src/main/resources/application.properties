spring.datasource.url=jdbc:postgresql://ep-xxxxxx.us-east-2.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=your_real_username
spring.datasource.password=your_real_password
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Tomcat Server Configuration
server.port=8081
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20


# HikariCP Database Connection Pool for PostgreSQL
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# External Service Feature Toggles
# Set to false to disable external API calls (offline mode for development/testing)
app.ai.enabled=false
app.email.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
